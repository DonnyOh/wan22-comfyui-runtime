name: Build Wan ComfyUI runtime

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Clone exact workflow commit
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" source
          cd source
          git fetch origin "$GITHUB_SHA" --depth 1
          git checkout --detach "$GITHUB_SHA"

      - name: Verify and expand sealed context
        shell: bash
        run: |
          set -euo pipefail
          cd source
          echo "8b4eaae4ac9b3985e58e26d5caf7e01a9f1402ba420bd0de3f44d337b9f06fa4  wan-custom-runtime-image.zip" | sha256sum -c -
          mkdir context
          unzip -q wan-custom-runtime-image.zip -d context
          test "$(python3 -c 'import json; print(json.load(open("context/CONTEXT-MANIFEST.json"))["context_sha256"])')" = "a8d08016bd68a316d2356ce852f047c59069d77829ad3a7dd11aa01045d13186"

      - name: Build and publish exact runtime
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/$owner/wan22-comfyui-runtime:ctx-a8d08016bd68a316"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --platform linux/amd64 --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$image" source/context
          docker push "$image"
          docker buildx imagetools inspect "$image" >> "$GITHUB_STEP_SUMMARY"

